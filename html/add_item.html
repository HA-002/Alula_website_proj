<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Item - AlUla Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f5f5;
      color: #333;
    }

    .container {
      background: #fff;
      padding: 30px;
      max-width: 600px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      color: #222;
    }

    p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    a:hover {
      background-color: #555;
    }

    .message {
      padding: 15px;
      background-color: #e0ffe0;
      border: 1px solid #a0d6a0;
      border-radius: 5px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Item Added Successfully</h2>
    <div class="message">
      Your item has been added. You can return to the dashboard to manage more items.
    </div>
    <a href="admin_dashboard.html">Back to Dashboard</a>
  </div>
</body>
</html>
